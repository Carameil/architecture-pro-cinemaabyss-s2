name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file for Docker Compose
        run: |
          cp .env.example .env
          echo "MOVIES_MIGRATION_PERCENT=50" >> .env
          echo "GRADUAL_MIGRATION=true" >> .env
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          echo "Waiting for services to be ready..."
      
      - name: Wait for services to be healthy
        run: |
          set -e
          timeout=300   # 5 minutes
          until [ $timeout -le 0 ]; do
            unhealthy=$(docker compose ps --format json 2>/dev/null \
              | jq -r '.[] | select(.State!="running" or (.Health!="healthy" and .Health!="" and .Health!="starting"))' \
              | wc -l)
            if [ "$unhealthy" -eq 0 ]; then
              echo "✅ All services are healthy"
              docker compose ps
              break
            fi
            echo "Waiting for services to be healthy... ($timeout seconds left)"
            sleep 10
            timeout=$((timeout-10))
          done
          if [ $timeout -le 0 ]; then
            echo "❌ Services did not become healthy in time"
            docker compose ps
            docker compose logs
            exit 1
          fi
      
      - name: Run API tests
        run: make test-ci
        
      - name: Upload Postman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results-standalone
          path: tests/postman/reports/
          retention-days: 30
      
      - name: Stop services
        if: always()
        run: docker compose down -v